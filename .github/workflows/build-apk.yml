name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set app icon (optional)
        continue-on-error: true
        run: |
          for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $p
            d=android/app/src/main/res/mipmap-$1
            convert icon-512.png -resize $2x$2 $d/ic_launcher.png
            cp $d/ic_launcher.png $d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: football-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
